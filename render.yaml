services:
  - type: web
    name: live-commerce-backend
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @livedrop/server start
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false

  - type: web
    name: live-commerce-frontend
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @livedrop/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_ICE_STUN_URLS
        sync: false
      - key: VITE_ICE_TURN_URLS
        sync: false
      - key: VITE_ICE_TURN_USERNAME
        sync: false
      - key: VITE_ICE_TURN_CREDENTIAL
        sync: false
      - key: VITE_ICE_TRANSPORT_POLICY
        sync: false
